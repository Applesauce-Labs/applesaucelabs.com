# cartographer settings for this repository. The map itself is built on each
# machine and never committed. https://github.com/shermanhuman/cartographer#map-your-project
#
# A project of one: this repo is its own anchor.
project = "applesaucelabs.com"
members = [{ repo = "Applesauce-Labs/applesaucelabs.com" }]
extract = ["javascript"]
source_roots = ["src", "utils"]
docs = ["README.md"]
